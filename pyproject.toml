[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omero-analysis-chat"
version = "0.7.2"
description = "Browser-local AI data analysis chat for OMERO.web"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "NL-BioImaging" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "omero-web>=5.6.0",
  "omero-workflow-skills>=0.2.1,<0.3",
  "packaging>=23",
]

[project.optional-dependencies]
test = [
  "Django>=3.2,<6",
  "pytest>=8",
  "pytest-django>=4.8",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/NL-BioImaging/OMERO.AnalysisChat"
Repository = "https://github.com/NL-BioImaging/OMERO.AnalysisChat"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omero_analysis_chat = [
  "templates/**/*.html",
  "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
