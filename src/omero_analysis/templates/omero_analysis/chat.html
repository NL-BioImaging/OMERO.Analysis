{% load analysis_assets %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>OMERO Analysis</title>
  <link rel="stylesheet" href="{% analysis_static 'omero_analysis/app.css' %}">
</head>
<body>
  <div id="root"
       data-token-url="{% url 'omero_analysis_token' %}"
       data-context-template="{% url 'omero_analysis_context' object_type='TYPE' object_id=1 %}"
       data-attachments-template="{% url 'omero_analysis_attachments' object_type='TYPE' object_id=1 %}"
       data-hierarchy-template="{% url 'omero_analysis_hierarchy' object_type='TYPE' object_id=1 %}"
       data-download-template="{% url 'omero_analysis_download' annotation_id=1 %}"
       data-upload-template="{% url 'omero_analysis_upload' object_type='TYPE' object_id=1 %}"
       data-snapshots-template="{% url 'omero_analysis_workspace_snapshots' object_type='TYPE' object_id=1 %}"
       data-snapshot-upload-template="{% url 'omero_analysis_workspace_snapshots' object_type='TYPE' object_id=1 %}"
       data-snapshot-download-template="{% url 'omero_analysis_workspace_snapshot_download' annotation_id=1 %}"
       data-pipeline-templates-template="{% url 'omero_analysis_pipeline_templates' object_type='TYPE' object_id=1 %}"
       data-pipeline-download-template="{% url 'omero_analysis_pipeline_download' annotation_id=1 %}"
       data-notebook-download-template="{% url 'omero_analysis_notebook_download' annotation_id=1 %}"
       data-notebook-upload-template="{% url 'omero_analysis_notebook_upload' object_type='TYPE' object_id=1 %}"
       data-workspace-sync-status-template="{% url 'omero_analysis_workspace_sync_status' object_type='TYPE' object_id=1 workspace_id='WORKSPACE' %}"
       data-workspace-sync-plan-template="{% url 'omero_analysis_workspace_sync_plan' object_type='TYPE' object_id=1 workspace_id='WORKSPACE' %}"
       data-workspace-sync-apply-template="{% url 'omero_analysis_workspace_sync_apply' object_type='TYPE' object_id=1 workspace_id='WORKSPACE' %}"
       data-workspace-sync-remove-template="{% url 'omero_analysis_workspace_sync_remove' object_type='TYPE' object_id=1 workspace_id='WORKSPACE' %}"
       data-workspace-library-template="{% url 'omero_analysis_workspace_library' object_type='TYPE' object_id=1 %}"
       data-workspace-library-download-template="{% url 'omero_analysis_workspace_library_download' annotation_id=1 %}"
       data-analysis-settings-template="{% url 'omero_analysis_settings' object_type='TYPE' object_id=1 %}"
       data-workflow-skills-url="{% url 'omero_analysis_workflow_skills' %}"
       data-zarr-viewer-status-url="{% url 'omero_analysis_zarr_viewer_integration' %}"
       data-keepalive-url="{% url 'omero_analysis_session_keepalive' %}"
       data-keepalive-interval="{{ keepalive_interval }}"
       data-style-nonce="{{ style_nonce }}"
       data-runtime-base="{% url 'omero_analysis_runtime_asset' asset_path='ASSET' %}">
    <div class="boot-message">Starting OMERO Analysis…</div>
  </div>
  {{ context|json_script:"omero-analysis-context" }}
  <script type="module" src="{% analysis_static 'omero_analysis/app.js' %}"></script>
</body>
</html>
