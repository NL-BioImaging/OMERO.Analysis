{% load static %}
<link rel="stylesheet" href="{% static 'omero_analysis/panel.css' %}?v=0.10.0-settings-help">
<script>
$(function () {
  "use strict";
  var panel = $("#omero_analysis_notebook_panel");
  panel.addClass("omero-analysis-center");
  var panelPattern = "{% url 'omero_analysis_notebook_panel' 'Image' 1 %}";
  var tokenUrl = "{% url 'omero_analysis_token' %}";
  var uploadPattern = "{% url 'omero_analysis_notebook_upload' 'Image' 1 %}";
  var analysisBase = "{% url 'omero_analysis_index' %}";
  var typeMap = {image: "Image", dataset: "Dataset", plate: "Plate", screen: "Screen"};

  function objectUrl(pattern, type, id) {
    return pattern.replace("/Image/1/", "/" + type + "/" + id + "/");
  }
  function csrfToken() {
    var match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return match ? decodeURIComponent(match[1]) : "";
  }
  function selectedLibraryIds(root) {
    return Array.from(root.querySelectorAll(".oa-library-item-input:checked"))
      .map(function (input) { return input.value; });
  }
  function updateLibrarySelection(root) {
    var badge = root.querySelector(".oa-library-selected-count");
    var count = selectedLibraryIds(root).length;
    if (badge) badge.textContent = count + " selected";
  }
  function filterLibrary(root, query) {
    var normalized = String(query || "").trim().toLowerCase();
    var anyDataset = false;
    root.querySelectorAll(".oa-tree-dataset").forEach(function (dataset) {
      var datasetText = String(dataset.dataset.searchText || "").toLowerCase();
      var anyItem = false;
      dataset.querySelectorAll(".oa-library-item").forEach(function (item) {
        var visible = !normalized ||
          datasetText.indexOf(normalized) >= 0 ||
          String(item.dataset.searchText || "").toLowerCase().indexOf(normalized) >= 0;
        item.hidden = !visible;
        if (visible) anyItem = true;
      });
      dataset.hidden = !anyItem;
      if (normalized && anyItem) {
        dataset.open = true;
        dataset.querySelectorAll(".oa-tree-group").forEach(function (group) {
          group.open = Array.from(group.querySelectorAll(".oa-library-item"))
            .some(function (item) { return !item.hidden; });
        });
      }
      if (anyItem) anyDataset = true;
    });
    var empty = root.querySelector(".oa-library-no-match");
    if (empty) empty.hidden = !normalized || anyDataset;
  }
  function analysisUrl(root, notebookId, libraryIds) {
    var url = analysisBase + "?tab=notebook&type=" +
      encodeURIComponent(root.dataset.objectType) + "&id=" +
      encodeURIComponent(root.dataset.objectId);
    root.querySelectorAll(".oa-data-attachment:checked").forEach(function (input) {
      url += "&data_annotation=" + encodeURIComponent(input.value);
    });
    if (notebookId) url += "&notebook_annotation=" + encodeURIComponent(notebookId);
    if (libraryIds.length) {
      url += "&open_library=1";
      libraryIds.forEach(function (annotationId) {
        url += "&library_item=" + encodeURIComponent(annotationId);
      });
    }
    return url;
  }
  function selectedNotebook(root) {
    var input = root.querySelector(".oa-notebook:checked");
    return input ? input.value : null;
  }
  function renderSelection(dtype, oid) {
    var type = typeMap[String(dtype || "").toLowerCase()];
    if (!type || !oid) {
      panel.html('<div class="oa-empty-state"><strong>Select an Image, Dataset, Plate, or Screen</strong></div>');
      return;
    }
    panel.html('<div class="oa-empty-state"><strong>Loading notebooks…</strong></div>');
    fetch(objectUrl(panelPattern, type, oid), {credentials: "same-origin"})
      .then(function (response) {
        if (!response.ok) throw new Error("Could not load notebooks (HTTP " + response.status + ")");
        return response.text();
      })
      .then(function (html) {
        panel.html(html);
        var root = panel[0].querySelector("[data-object-type]");
        if (root) updateLibrarySelection(root);
      })
      .catch(function (error) {
        panel.html('<p class="oa-panel-error"></p>');
        panel.find(".oa-panel-error").text(error.message);
      });
  }
  panel.omeroweb_center_plugin({
    plugin_index: {{ forloop.counter|default:"0" }},
    empty_on_sel_change: false,
    supported_obj_types: ["image", "dataset", "plate", "screen"],
    load_plugin_content: function (selected, dtype, oid) { renderSelection(dtype, oid); }
  });
  panel.on("change", ".oa-library-item-input", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    if (root) updateLibrarySelection(root);
  });
  panel.on("input", ".oa-library-search input", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    if (root) filterLibrary(root, event.currentTarget.value);
  });
  panel.on("click", ".oa-open-notebook", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    var fileInput = root && root.querySelector(".oa-notebook-upload");
    var file = fileInput && fileInput.files && fileInput.files[0];
    if (!root) return;
    if (!file) {
      var notebookId = selectedNotebook(root);
      var libraryIds = selectedLibraryIds(root);
      if (!notebookId && !libraryIds.length) {
        root.querySelector(".oa-panel-status").textContent =
          "Select an attached notebook, upload one, or select one from AnalysisWorkspaces.";
        return;
      }
      window.open(analysisUrl(root, notebookId, libraryIds), "_blank", "noopener");
      return;
    }
    var status = root.querySelector(".oa-panel-status");
    status.textContent = "Uploading and attaching notebook…";
    fetch(tokenUrl, {
      method: "POST", credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-CSRFToken": csrfToken()},
      body: JSON.stringify({object_type: root.dataset.objectType, object_id: Number(root.dataset.objectId)})
    })
      .then(function (response) { return response.json().then(function (body) {
        if (!response.ok) throw new Error((body.error && body.error.message) || "Could not authorize upload");
        return body.context_token;
      }); })
      .then(function (token) {
        var form = new FormData();
        form.append("file", file, file.name);
        return fetch(objectUrl(uploadPattern, root.dataset.objectType, root.dataset.objectId), {
          method: "POST", credentials: "same-origin",
          headers: {"X-CSRFToken": csrfToken(), "X-OMERO-Analysis-Context": token},
          body: form
        });
      })
      .then(function (response) { return response.json().then(function (body) {
        if (!response.ok) throw new Error((body.error && body.error.message) || "Notebook upload failed");
        return body.notebook.annotation_id;
      }); })
      .then(function (notebookId) {
        window.open(
          analysisUrl(root, notebookId, selectedLibraryIds(root)),
          "_blank",
          "noopener"
        );
      })
      .catch(function (error) { status.textContent = error.message; });
  });
});
</script>
