{% load analysis_assets %}
<link rel="stylesheet" href="{% analysis_static 'omero_analysis/panel.css' %}&amp;layout=workspace-choices-2">
<script>
$(function () {
  "use strict";
  var panel = $("#omero_analysis_panel");
  panel.addClass("omero-analysis-center");
  var panelPattern = "{% url 'omero_analysis_panel' 'Image' 1 %}";
  var analysisBase = "{% url 'omero_analysis_index' %}";
  var biomeroBase = "/omero_biomero/biomero/";
  var tokenUrl = "{% url 'omero_analysis_token' %}";
  var attachmentUploadPattern = "{% url 'omero_analysis_upload' 'Image' 1 %}";
  var stagedAssignPattern = "{% url 'omero_analysis_staged_assign' 'Image' 1 %}";
  var sharedLibraryPattern = "{% url 'omero_analysis_shared_library' 'Image' 1 %}";
  var sharedLibraryModule = "{% analysis_static 'omero_analysis/shared-library-panel.js' %}";
  var typeMap = {
    image: "Image",
    dataset: "Dataset",
    plate: "Plate",
    screen: "Screen",
    project: "Project",
    well: "Well"
  };
  var multiSourceTypes = {image: true, plate: true};

  function objectUrl(pattern, type, id) {
    return pattern.replace("/Image/1/", "/" + type + "/" + id + "/");
  }

  function csrfToken() {
    var match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return match ? decodeURIComponent(match[1]) : "";
  }

  function uploadAttachment(root, file) {
    var status = root.querySelector(".oa-panel-status");
    var uploadMode = root.dataset.attachmentUploadMode;
    var uploaded;
    status.textContent = (uploadMode === "source" ? "Attaching " : "Staging ") + file.name + " securely…";
    return fetch(tokenUrl, {
      method: "POST", credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-CSRFToken": csrfToken()},
      body: JSON.stringify({
        object_type: root.dataset.objectType,
        object_id: Number(root.dataset.objectId)
      })
    })
      .then(function (response) { return response.json().then(function (body) {
        if (!response.ok) {
          throw new Error((body.error && body.error.message) || "Could not authorize upload");
        }
        return body.context_token;
      }); })
      .then(function (token) {
        var form = new FormData();
        form.append("file", file, file.name);
        return fetch(
          objectUrl(attachmentUploadPattern, root.dataset.objectType, root.dataset.objectId),
          {
            method: "POST", credentials: "same-origin",
            headers: {"X-CSRFToken": csrfToken(), "X-OMERO-Analysis-Context": token},
            body: form
          }
        );
      })
      .then(function (response) { return response.json().then(function (body) {
        if (!response.ok) {
          throw new Error((body.error && body.error.message) || "Attachment upload failed");
        }
        uploaded = body;
        return body;
      }); })
      .then(function () {
        return renderSelection(
          [{id: root.dataset.objectType.toLowerCase() + "-" + root.dataset.objectId}],
          root.dataset.objectType,
          root.dataset.objectId
        );
      })
      .then(function () {
        var refreshed = panel[0].querySelector("[data-object-type]");
        if (!refreshed) return;
        if (uploaded.mode === "source" && uploaded.attachment) {
          var input = refreshed.querySelector(
            '.oa-data-attachment[value="' + uploaded.attachment.annotation_id + '"]'
          );
          if (input) input.checked = true;
        }
        updateSelection(refreshed);
        var refreshedStatus = refreshed.querySelector(".oa-panel-status");
        if (refreshedStatus) {
          refreshedStatus.textContent = uploaded.mode === "source"
            ? file.name + " is attached to this source and selected."
            : file.name + " is staged and selected.";
        }
      })
      .catch(function (error) { status.textContent = error.message; });
  }

  function assignStagedAttachments(root, workspaceId, stagingIds) {
    if (!stagingIds.length) return Promise.resolve();
    return fetch(tokenUrl, {
      method: "POST", credentials: "same-origin",
      headers: {"Content-Type": "application/json", "X-CSRFToken": csrfToken()},
      body: JSON.stringify({
        object_type: root.dataset.objectType,
        object_id: Number(root.dataset.objectId)
      })
    })
      .then(function (response) { return response.json().then(function (body) {
        if (!response.ok) throw new Error((body.error && body.error.message) || "Could not authorize staged upload");
        return body.context_token;
      }); })
      .then(function (token) {
        return fetch(
          objectUrl(stagedAssignPattern, root.dataset.objectType, root.dataset.objectId),
          {
            method: "POST", credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": csrfToken(),
              "X-OMERO-Analysis-Context": token
            },
            body: JSON.stringify({workspace_id: workspaceId, staging_ids: stagingIds})
          }
        );
      })
      .then(function (response) { return response.json().then(function (body) {
        if (!response.ok) throw new Error((body.error && body.error.message) || "Could not assign staged upload");
        return body;
      }); });
  }

  function selectedAnnotationIds(root) {
    return Array.from(root.querySelectorAll(".oa-data-attachment:checked"))
      .map(function (input) { return input.value; });
  }

  function selectedStagedIds(root) {
    return Array.from(root.querySelectorAll(".oa-staged-attachment:checked"))
      .map(function (input) { return input.value; });
  }

  function selectedWorkspaceId(root) {
    var input = root.querySelector(".oa-workspace-snapshot:checked");
    return input ? input.value : null;
  }

  function selectedLibraryIds(root) {
    return Array.from(root.querySelectorAll(".oa-library-item-input:checked"))
      .map(function (input) { return input.value; });
  }

  function filterLibrary(root, query) {
    var normalized = String(query || "").trim().toLowerCase();
    var treeRoot = root.querySelector(".oa-tree-root-node");
    if (normalized && treeRoot) treeRoot.open = true;
    var anyDataset = false;
    root.querySelectorAll(".oa-tree-dataset").forEach(function (dataset) {
      var datasetText = String(dataset.dataset.searchText || "").toLowerCase();
      var anyItem = false;
      dataset.querySelectorAll(".oa-library-item").forEach(function (item) {
        var visible = !normalized ||
          datasetText.indexOf(normalized) >= 0 ||
          String(item.dataset.searchText || "").toLowerCase().indexOf(normalized) >= 0;
        item.hidden = !visible;
        if (visible) anyItem = true;
      });
      dataset.hidden = !anyItem;
      if (normalized && anyItem) {
        dataset.open = true;
        dataset.querySelectorAll(".oa-tree-group").forEach(function (group) {
          group.open = Array.from(group.querySelectorAll(".oa-library-item"))
            .some(function (item) { return !item.hidden; });
        });
      }
      if (anyItem) anyDataset = true;
    });
    var empty = root.querySelector(".oa-library-no-match");
    if (empty) empty.hidden = !normalized || anyDataset;
  }

  function selectedSourceIds(root) {
    return String(root.dataset.selectionIds || "")
      .split(",")
      .map(function (value) { return Number(value); })
      .filter(function (value) { return Number.isInteger(value) && value > 0; });
  }

  function analysisUrl(type, id, annotationIds, workspaceAnnotationId, libraryIds, selectionIds, stagedIds) {
    var url = analysisBase + "?type=" + encodeURIComponent(type) +
      "&id=" + encodeURIComponent(id);
    (selectionIds || []).forEach(function (selectionId) {
      url += "&selection_id=" + encodeURIComponent(selectionId);
    });
    if (workspaceAnnotationId) {
      url += "&workspace_annotation=" + encodeURIComponent(workspaceAnnotationId);
    } else {
      annotationIds.forEach(function (annotationId) {
        url += "&data_annotation=" + encodeURIComponent(annotationId);
      });
    }
    if (libraryIds.length) {
      url += "&open_library=1";
      libraryIds.forEach(function (annotationId) {
        url += "&library_item=" + encodeURIComponent(annotationId);
      });
    }
    (stagedIds || []).forEach(function (stagingId) {
      url += "&staged_attachment=" + encodeURIComponent(stagingId);
    });
    return url;
  }

  function biomeroAnalysisUrl(type, id, annotationIds, workspaceAnnotationId, libraryIds, selectionIds, stagedIds) {
    var url = biomeroBase + "?tab=data-analysis" +
      "&analysis_type=" + encodeURIComponent(type) +
      "&analysis_id=" + encodeURIComponent(id);
    (selectionIds || []).forEach(function (selectionId) {
      url += "&analysis_selection_id=" + encodeURIComponent(selectionId);
    });
    if (workspaceAnnotationId) {
      url += "&analysis_workspace_annotation=" + encodeURIComponent(workspaceAnnotationId);
    } else {
      annotationIds.forEach(function (annotationId) {
        url += "&analysis_data_annotation=" + encodeURIComponent(annotationId);
      });
    }
    if (libraryIds.length) {
      url += "&analysis_open_library=1";
      libraryIds.forEach(function (annotationId) {
        url += "&analysis_library_item=" + encodeURIComponent(annotationId);
      });
    }
    (stagedIds || []).forEach(function (stagingId) {
      url += "&analysis_staged_attachment=" + encodeURIComponent(stagingId);
    });
    return url;
  }

  function updateSelection(root) {
    if (root.dataset.panelKind !== "source") return;
    var count = selectedAnnotationIds(root).length;
    var stagedCount = selectedStagedIds(root).length;
    var workspaceId = selectedWorkspaceId(root);
    var libraryCount = selectedLibraryIds(root).length;
    var selectionCount = selectedSourceIds(root).length;
    var countBadge = root.querySelector(".oa-selected-count");
    var libraryBadge = root.querySelector(".oa-library-selected-count");
    var status = root.querySelector(".oa-panel-status");
    var button = root.querySelector(".oa-new-workspace");
    if (countBadge) countBadge.textContent = (selectionCount || count + stagedCount) + " selected";
    if (libraryBadge) libraryBadge.textContent = libraryCount + " selected";
    if (status) {
      status.textContent = count + stagedCount
        ? (count + stagedCount) + " data attachment" + (count + stagedCount === 1 ? "" : "s") + " selected for the workspace."
        : selectionCount > 1
        ? selectionCount + " selected objects will define the new workspace."
        : "Select at least one data attachment to start a new workspace.";
      if (libraryCount) status.textContent += " " + libraryCount + " reusable item" + (libraryCount === 1 ? "" : "s") + " selected for import.";
    }
    if (button) {
      button.textContent = "Start new Workspace";
      button.disabled = count + stagedCount === 0 && selectionCount < 2;
    }
  }

  function selectionParts(selected) {
    return (selected || []).map(function (item) {
      var parts = String(item.id || "").split("-");
      return {type: String(parts[0] || "").toLowerCase(), id: Number(parts[1])};
    }).filter(function (item) { return item.type && Number.isInteger(item.id) && item.id > 0; });
  }

  function renderGuidance(title, message) {
    panel.html(
      '<section class="oa-object"><header class="oa-panel-header"><div>' +
      '<span class="oa-eyebrow">OMERO Analysis</span><h2></h2></div>' +
      '<span class="oa-object-badge">Selection</span></header>' +
      '<section class="oa-card oa-info-card"><div class="oa-section-heading"><div>' +
      '<span class="oa-step">i</span><h3></h3></div></div><p class="oa-help"></p>' +
      '</section></section>'
    );
    panel.find(".oa-panel-header h2, .oa-info-card h3").text(title);
    panel.find(".oa-info-card .oa-help").text(message);
  }

  function renderSelection(selected, dtype, oid) {
    var parts = selectionParts(selected);
    if (parts.length > 1) {
      var firstType = parts[0].type;
      var sameType = parts.every(function (item) { return item.type === firstType; });
      if (!sameType || !multiSourceTypes[firstType]) {
        renderGuidance(
          "Choose one analysis source",
          "Multiple selection creates one Workspace only for Images or Plates of the same type. " +
          "Select one Dataset or Screen, or select Images or Plates together."
        );
        return Promise.resolve();
      }
      dtype = firstType;
      oid = parts[0].id;
    }
    var type = typeMap[String(dtype || "").toLowerCase()];
    if (!type || !oid) {
      renderGuidance(
        "Select an analysis source",
        "Choose a Dataset, Screen, Plate, Image, or a selection of Images or Plates."
      );
      return Promise.resolve();
    }
    panel.html('<div class="oa-empty-state"><strong>Loading Analysis…</strong></div>');
    var panelUrl = objectUrl(panelPattern, type, oid);
    if (parts.length > 1) {
      panelUrl += "?" + parts.map(function (item) {
        return "selection_id=" + encodeURIComponent(item.id);
      }).join("&");
    }
    return fetch(panelUrl, {credentials: "same-origin"})
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Could not load Analysis (HTTP " + response.status + ")");
        }
        return response.text();
      })
      .then(function (html) {
        panel.html(html);
        var root = panel[0].querySelector("[data-object-type]");
        if (root) {
          updateSelection(root);
          if (root.querySelector('.oa-shared-library')) {
            import(sharedLibraryModule).then(function (module) {
              return module.mountSharedLibrary(root, objectUrl(sharedLibraryPattern, type, oid), tokenUrl);
            }).catch(function (error) {
              root.querySelector('.oa-shared-library').textContent = 'Shared library unavailable: ' + error.message;
            });
          }
        }
      })
      .catch(function (error) {
        panel.html('<p class="oa-panel-error"></p>');
        panel.find(".oa-panel-error").text(error.message);
      });
  }

  panel.omeroweb_center_plugin({
    plugin_index: {{ forloop.counter|default:"0" }},
    empty_on_sel_change: false,
    plugin_enabled: function (selected) { return Boolean(selected && selected.length); },
    load_plugin_content: function (selected, dtype, oid) {
      renderSelection(selected, dtype, oid);
    }
  });

  panel.on("change", ".oa-data-attachment, .oa-staged-attachment", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    if (root) {
      root.querySelectorAll(".oa-workspace-snapshot").forEach(function (input) {
        input.checked = false;
      });
      updateSelection(root);
    }
  });

  panel.on("change", ".oa-workspace-snapshot", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    if (root) {
      root.querySelectorAll(".oa-data-attachment").forEach(function (input) {
        input.checked = false;
      });
      updateSelection(root);
    }
  });

  panel.on("change", ".oa-library-item-input", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    if (root) updateSelection(root);
  });

  panel.on("input", ".oa-library-search input", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    if (root) filterLibrary(root, event.currentTarget.value);
  });

  panel.on("click", ".oa-open-analysis, .oa-new-workspace, .oa-resume-workspace, .oa-restore-snapshot", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    if (!root) return;
    var launchArguments = [
      root.dataset.analysisObjectType || root.dataset.objectType,
      root.dataset.analysisObjectId || root.dataset.objectId,
      selectedAnnotationIds(root),
      selectedWorkspaceId(root),
      selectedLibraryIds(root),
      selectedSourceIds(root),
      selectedStagedIds(root)
    ];
    var create = event.currentTarget.classList.contains("oa-new-workspace");
    if (create && !selectedAnnotationIds(root).length && !selectedStagedIds(root).length && selectedSourceIds(root).length < 2) return;
    var workspace = event.currentTarget.dataset.workspaceId || root.dataset.workspaceId;
    if (workspace || create) launchArguments[3] = null;
    var snapshot = event.currentTarget.dataset.snapshotId;
    if (workspace || snapshot) {
      // Resuming a workspace must not import choices from the new-workspace form.
      launchArguments[2] = [];
      launchArguments[4] = [];
      launchArguments[5] = [];
      // Staged uploads remain selected: opening this workspace adopts them
      // into its managed Dataset instead of attaching them to the source.
    }
    if (snapshot) {
      launchArguments[3] = snapshot;
      // A detached snapshot does not expose its workspace ID until it has
      // opened, so it cannot safely claim staged uploads from this panel.
      launchArguments[6] = [];
    }
    var targetWorkspaceId = create ? crypto.randomUUID() : workspace;
    if (create && root.dataset.sharedSelection) {
      try {
        var sharedItems = JSON.parse(root.dataset.sharedSelection);
        if (sharedItems.length) {
          var handoffKey = 'omero-analysis-shared:' + [root.dataset.userId, root.dataset.groupId,
            root.dataset.analysisObjectType || root.dataset.objectType,
            root.dataset.analysisObjectId || root.dataset.objectId, targetWorkspaceId].join(':');
          localStorage.setItem(handoffKey, JSON.stringify({expires: Date.now() + 900000, items: sharedItems}));
        }
      } catch (error) {
        root.querySelector('.oa-panel-status').textContent = 'Could not preserve shared library selection: ' + error.message;
        return;
      }
    }
    function targetUrl(integrated) {
      var url = new URL((integrated ? biomeroAnalysisUrl : analysisUrl).apply(null, launchArguments), window.location.origin);
      var prefix = integrated ? "analysis_" : "";
      if (create) url.searchParams.set(prefix + "new_workspace", targetWorkspaceId);
      else if (workspace) url.searchParams.set(prefix + "workspace_id", workspace);
      return url.toString();
    }
    if (root.dataset.integratedDataAnalysis === "true") {
      var status = root.querySelector(".oa-panel-status");
      if (status && selectedStagedIds(root).length) status.textContent = "Assigning staged uploads to the Workspace…";
      assignStagedAttachments(root, targetWorkspaceId, selectedStagedIds(root))
        .then(function () { window.location.assign(targetUrl(true)); })
        .catch(function (error) { if (status) status.textContent = error.message; });
      return;
    }
    window.open(
      targetUrl(false),
      "_blank",
      "noopener"
    );
  });

  panel.on("click", ".oa-upload-attachment", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    var input = root && root.querySelector(".oa-attachment-upload-input");
    if (input) input.click();
  });

  panel.on("change", ".oa-attachment-upload-input", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    var file = event.currentTarget.files && event.currentTarget.files[0];
    if (root && file) uploadAttachment(root, file);
  });
});
</script>
