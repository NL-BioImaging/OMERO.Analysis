{% load static %}
<link rel="stylesheet" href="{% static 'omero_analysis_chat/panel.css' %}">
<script>
$(function () {
  "use strict";
  var panel = $("#omero_analysis_chat_panel");
  panel.addClass("omero-analysis-chat-center");
  var panelPattern = "{% url 'omero_analysis_chat_panel' 'Image' 1 %}";
  var chatUrl = "{% url 'omero_analysis_chat_index' %}";
  var typeMap = {
    image: "Image",
    dataset: "Dataset",
    plate: "Plate",
    screen: "Screen"
  };

  function objectUrl(pattern, type, id) {
    return pattern.replace("/Image/1/", "/" + type + "/" + id + "/");
  }

  function selectedAnnotationIds(root) {
    return Array.from(root.querySelectorAll(".oac-data-attachment:checked"))
      .map(function (input) { return input.value; });
  }

  function selectedProjectId(root) {
    var input = root.querySelector(".oac-project-snapshot:checked");
    return input ? input.value : null;
  }

  function analysisUrl(type, id, annotationIds, projectAnnotationId) {
    var url = chatUrl + "?type=" + encodeURIComponent(type) +
      "&id=" + encodeURIComponent(id);
    if (projectAnnotationId) {
      return url + "&project_annotation=" + encodeURIComponent(projectAnnotationId);
    }
    annotationIds.forEach(function (annotationId) {
      url += "&data_annotation=" + encodeURIComponent(annotationId);
    });
    return url;
  }

  function updateSelection(root) {
    var count = selectedAnnotationIds(root).length;
    var projectId = selectedProjectId(root);
    var countBadge = root.querySelector(".oac-selected-count");
    var status = root.querySelector(".oac-panel-status");
    var button = root.querySelector(".oac-open-chat");
    if (countBadge) countBadge.textContent = count + " selected";
    if (status) {
      status.textContent = projectId
        ? "The saved project will be restored locally and its OMERO inputs synchronized."
        : count
        ? count + " attachment" + (count === 1 ? "" : "s") +
          " will be downloaded before chat unlocks."
        : "No OMERO data selected; you can add local files after opening the chat.";
    }
    if (button) {
      button.innerHTML = projectId
        ? '<span aria-hidden="true">&#8635;</span> Resume selected project'
        : count
        ? '<span aria-hidden="true">&#8599;</span> Open with ' + count +
          " attachment" + (count === 1 ? "" : "s")
        : '<span aria-hidden="true">&#8599;</span> Open Analysis Chat';
    }
  }

  function renderSelection(dtype, oid) {
    var type = typeMap[String(dtype || "").toLowerCase()];
    if (!type || !oid) {
      panel.html('<div class="oac-empty-state"><strong>Select an OMERO object</strong><span>Choose an Image, Dataset, Plate, or Screen.</span></div>');
      return Promise.resolve();
    }
    panel.html('<div class="oac-empty-state"><strong>Loading Analysis Chat…</strong></div>');
    return fetch(objectUrl(panelPattern, type, oid), {credentials: "same-origin"})
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Could not load Analysis Chat (HTTP " + response.status + ")");
        }
        return response.text();
      })
      .then(function (html) {
        panel.html(html);
        var root = panel[0].querySelector("[data-object-type]");
        if (root) updateSelection(root);
      })
      .catch(function (error) {
        panel.html('<p class="oac-panel-error"></p>');
        panel.find(".oac-panel-error").text(error.message);
      });
  }

  panel.omeroweb_center_plugin({
    plugin_index: {{ forloop.counter|default:"0" }},
    empty_on_sel_change: false,
    supported_obj_types: ["image", "dataset", "plate", "screen"],
    load_plugin_content: function (selected, dtype, oid) {
      renderSelection(dtype, oid);
    }
  });

  panel.on("change", ".oac-data-attachment", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    if (root) {
      root.querySelectorAll(".oac-project-snapshot").forEach(function (input) {
        input.checked = false;
      });
      updateSelection(root);
    }
  });

  panel.on("change", ".oac-project-snapshot", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    if (root) {
      root.querySelectorAll(".oac-data-attachment").forEach(function (input) {
        input.checked = false;
      });
      updateSelection(root);
    }
  });

  panel.on("click", ".oac-open-chat", function (event) {
    var root = event.currentTarget.closest("[data-object-type]");
    if (!root) return;
    window.open(
      analysisUrl(
        root.dataset.objectType,
        root.dataset.objectId,
        selectedAnnotationIds(root),
        selectedProjectId(root)
      ),
      "_blank",
      "noopener"
    );
  });
});
</script>
