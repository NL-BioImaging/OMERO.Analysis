[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omero-analysis-notebook"
version = "0.1.0"
description = "Portable offline-first notebook protocol and SDK for OMERO.Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "NL-BioImaging" }]
dependencies = [
  "duckdb>=1.2,<2",
  "pandas>=2,<4",
]

[project.optional-dependencies]
widgets = ["ipywidgets>=8,<9"]
run = ["ipykernel>=6,<8", "nbclient>=0.10,<1", "nbformat>=5.10,<6"]
test = ["pytest>=8", "openpyxl>=3.1,<4"]

[project.scripts]
oan = "omero_analysis_notebook.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
