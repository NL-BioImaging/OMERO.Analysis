name: WorkflowSkills compatibility
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt 'biomero-workflow-skills==0.4.0'
      - run: python -m pip install --no-deps .
      - run: python -m pytest tests/test_workflow_skills.py tests/test_installed_workflow_skills.py -q
        env:
          WORKFLOW_SKILLS_RUN_INTEGRATION: '1'
