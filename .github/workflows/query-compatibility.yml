name: Data query compatibility
on:
  pull_request:
    paths:
      - 'src/omero_analysis/data_query*'
      - 'src/omero_analysis/views.py'
      - 'tests/test*query*'
      - 'tests/test_worker_contract.py'
      - '.github/workflows/query-compatibility.yml'
  workflow_dispatch:
    inputs:
      worker_ref:
        description: Exact worker commit or branch to test with this Analysis revision
        required: true
        default: 2be0f198be4a35eb03886b59f065bd2ace1e3c34
permissions:
  contents: read
jobs:
  http-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: OMERO.Analysis
      - uses: actions/checkout@v4
        with:
          repository: NL-BioImaging/OMERO.DataQueryWorker
          ref: ${{ inputs.worker_ref || '2be0f198be4a35eb03886b59f065bd2ace1e3c34' }}
          fetch-depth: 0
          path: OMERO.DataQueryWorker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv OMERO.DataQueryWorker/.venv
      - run: OMERO.DataQueryWorker/.venv/bin/pip install -e 'OMERO.DataQueryWorker[test]'
      - run: python -m pip install --no-deps -e OMERO.Analysis
      - run: python -m pip install 'Django>=3.2,<6' cryptography requests requests-toolbelt numpy Pillow pytest pytest-django duckdb
      - run: python -m pytest tests/test_worker_contract.py -q
        working-directory: OMERO.Analysis
        env:
          DQW_RUN_INTEGRATION: '1'
