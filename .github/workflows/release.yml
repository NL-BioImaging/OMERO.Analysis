name: Publish verified release wheels
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing GitHub Release version to publish unchanged to PyPI
        required: true
        default: '1.0.1'
        type: string
permissions:
  contents: read
concurrency:
  group: analysis-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validation:
    if: github.event_name == 'release'
    uses: ./.github/workflows/validate.yml
  query-compatibility:
    if: github.event_name == 'release'
    uses: ./.github/workflows/query-compatibility.yml
  viewer-compatibility:
    if: github.event_name == 'release'
    uses: ./.github/workflows/viewer-compatibility.yml
  host-compatibility:
    if: github.event_name == 'release'
    uses: ./.github/workflows/host-compatibility.yml
  skills-compatibility:
    if: github.event_name == 'release'
    uses: ./.github/workflows/skills-compatibility.yml
  attach-release-assets:
    needs: [validation, query-compatibility, viewer-compatibility, host-compatibility, skills-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: analysis-distributions
          path: dist/analysis/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notebook-sdk-distributions
          path: dist/notebook-sdk/
      - name: Check tag and generate checksums from actual wheels
        run: |
          python scripts/check_release_version.py
          python scripts/build_release_manifest.py --version "${GITHUB_REF_NAME#v}" --output dist/manifest.json dist/analysis/*.whl dist/notebook-sdk/*.whl
      - name: Attach wheels and manifest (identical retries only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/upload_release_assets.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --manifest dist/manifest.json --directory dist/analysis --directory dist/notebook-sdk
  publish-pypi:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/omero-analysis
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify and select the existing application wheel
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/download_analysis_release.py --version "$RELEASE_VERSION" --output dist/wheelhouse
          python scripts/verify_wheel.py "dist/wheelhouse/omero_analysis-${RELEASE_VERSION}-py3-none-any.whl"
          mkdir -p dist/pypi
          cp "dist/wheelhouse/omero_analysis-${RELEASE_VERSION}-py3-none-any.whl" dist/pypi/
      - name: Publish identical wheel through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/pypi/
