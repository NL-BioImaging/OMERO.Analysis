name: Attach verified GitHub Release wheels
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: analysis-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validation:
    uses: ./.github/workflows/validate.yml
  attach-release-assets:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: analysis-distributions
          path: dist/analysis/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notebook-sdk-distributions
          path: dist/notebook-sdk/
      - name: Check tag and generate checksums from actual wheels
        run: |
          python scripts/check_release_version.py
          python scripts/build_release_manifest.py --version "${GITHUB_REF_NAME#v}" --output dist/manifest.json dist/analysis/*.whl dist/notebook-sdk/*.whl
      - name: Attach wheels and manifest (identical retries only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/upload_release_assets.py --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --manifest dist/manifest.json --directory dist/analysis --directory dist/notebook-sdk
