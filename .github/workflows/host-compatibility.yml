name: BIOMERO host compatibility
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Analysis
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NL-BioImaging/OMERO.biomero
          # analysis_integration; advance only after testing the installed wheel.
          ref: 75adc977a2de5ab86e032bc25713a8185bbc841e
          fetch-depth: 0
          path: Host
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r Analysis/requirements-dev.txt
      - run: python -m pip install --no-deps ./Analysis ./Host
      - run: python -m pytest tests/test_host_capabilities.py tests/test_installed_biomero.py -q
        working-directory: Analysis
        env:
          BIOMERO_RUN_INTEGRATION: '1'
