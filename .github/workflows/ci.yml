name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    uses: ./.github/workflows/validate.yml
  deployment-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.OMERO_SMOKE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python scripts/smoke_omero_deployment.py "${{ vars.OMERO_SMOKE_URL }}"
        env:
          OMERO_ANALYSIS_SMOKE_COOKIE: ${{ secrets.OMERO_SMOKE_COOKIE }}
