name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install "Django>=3.2,<6" pytest pytest-django build setuptools wheel
      - run: python -m pip install "omero-workflow-skills @ git+https://github.com/NL-BioImaging/OMERO.WorkflowSkills.git@main"
      - run: python -m pytest

  frontend-and-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: python -m pip install build setuptools wheel
      - run: python scripts/build_frontend.py --skip-install
      - run: npm run smoke:runtime
        working-directory: frontend
      - run: npm run smoke:browser
        working-directory: frontend
      - run: python -m build --wheel --no-isolation
      - run: python scripts/verify_wheel.py dist/omero_analysis_chat-*.whl
      - uses: actions/checkout@v4
        with:
          repository: NL-BioImaging/OMERO.WorkflowSkills
          path: OMERO.WorkflowSkills
      - run: >-
          python scripts/build_companion_wheelhouse.py
          --plugin-wheel dist/omero_analysis_chat-*.whl
          --output dist/wheelhouse
          --catalog-repo OMERO.WorkflowSkills
