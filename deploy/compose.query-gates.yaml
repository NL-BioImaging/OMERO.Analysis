# Entirely disposable OMERO stack. Never attach production volumes/networks.
services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: omero
      POSTGRES_DB: omero
      POSTGRES_PASSWORD: ${GATE_OMERO_PASSWORD:?Generate a private gate environment file}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [gate]
  omeroserver:
    image: cellularimagingcf/omeroserver:1.7.0-beta.11
    restart: unless-stopped
    depends_on: [database]
    environment:
      CONFIG_omero_db_host: database
      CONFIG_omero_db_user: omero
      CONFIG_omero_db_name: omero
      CONFIG_omero_db_pass: ${GATE_OMERO_PASSWORD}
      ROOTPASS: ${GATE_OMERO_PASSWORD}
    volumes:
      - omero:/OMERO
    networks: [gate]
  web:
    image: omero-analysis-web:recovery
    restart: unless-stopped
    depends_on: [omeroserver, data-query-worker]
    environment:
      OMEROHOST: omeroserver
      CONFIG_omero_web_wsgi__timeout: "1800"
      ROOTPASS: ${GATE_OMERO_PASSWORD}
      OMERO_ANALYSIS_DATA_QUERY_WORKER_URL: http://data-query-worker:8080
      OMERO_ANALYSIS_DATA_QUERY_WORKER_TOKEN: ${GATE_WORKER_TOKEN:?Generate a private gate environment file}
      OMERO_ANALYSIS_DATA_QUERY_REQUEST_TIMEOUT_SECONDS: "930"
      OMERO_ANALYSIS_DATA_QUERY_SOURCE_UPLOAD_TIMEOUT_SECONDS: "1800"
      OMERO_ANALYSIS_DATA_QUERY_RESULT_TTL_SECONDS: "3600"
      OMERO_ANALYSIS_DATA_QUERY_STATE_DIR: /opt/omero/web/OMERO.web/var/query-state
      OMERO_ANALYSIS_DATA_QUERY_AUDIT_FILE: /opt/omero/web/OMERO.web/var/log/data-query-audit.jsonl
      OMERO_ANALYSIS_DATA_QUERY_PROMOTION_MAX_BYTES: "2147483648"
    volumes:
      - web:/opt/omero/web/OMERO.web/var
    networks: [gate]
  data-query-worker:
    image: omero-data-query-worker:recovery
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 128
    environment:
      DQW_API_TOKEN: ${GATE_WORKER_TOKEN}
      DQW_MAX_RESULT_ROWS: "10000000"
      DQW_MAX_RESULT_BYTES: "2147483648"
      DQW_DUCKDB_MEMORY_LIMIT: 256MB
      DQW_QUERY_TIMEOUT_SECONDS: "900"
      DQW_INGESTION_TIMEOUT_SECONDS: "1800"
    volumes:
      - cache:/var/lib/omero-data-query-worker
    networks: [gate]
volumes:
  database:
  omero:
  web:
  cache:
networks:
  gate:
    internal: true
